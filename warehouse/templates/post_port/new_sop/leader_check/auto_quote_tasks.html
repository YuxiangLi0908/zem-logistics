<section id="auto-quote-tasks" class="mt-4" aria-label="自动询价任务">
    {% csrf_token %}
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h5>自动询价任务</h5><button type="button" id="auto-refresh" class="btn btn-sm btn-outline-primary">刷新任务</button>
    </div>
    <div id="auto-worker-state" class="small text-muted mb-2"></div>
    <div id="auto-ui-message" class="alert alert-info" hidden role="status"></div>
    <div id="auto-task-list">
    <div class="table-responsive"><table class="table table-sm table-bordered">
        <thead><tr><th>任务</th><th>组 / 发货仓</th><th>执行人</th><th>创建时间</th><th>状态 / 进度</th><th>操作</th></tr></thead>
        <tbody id="auto-batches"></tbody>
    </table></div>
    <div class="d-flex gap-2 align-items-center">
        <button type="button" id="auto-batches-prev" class="btn btn-sm btn-outline-secondary">上一页</button>
        <span id="auto-batches-page"></span>
        <button type="button" id="auto-batches-next" class="btn btn-sm btn-outline-secondary">下一页</button>
    </div>
    </div>
    <div id="auto-detail" class="mt-4" hidden>
        <h5 id="auto-detail-title"></h5>
        <p id="auto-detail-summary"></p>
        <details class="mb-2"><summary>查看本次询价条件</summary><pre id="auto-detail-parameters" style="white-space:pre-wrap"></pre></details>
        <div class="d-flex gap-2 align-items-center mb-2">
            <label for="auto-item-status">筛选结果</label>
            <select id="auto-item-status" class="form-select" style="width:160px">
                <option value="">全部</option><option value="pending">等待中</option><option value="running">询价中</option>
                <option value="success">报价完整</option><option value="partial">部分报价</option>
                <option value="failed">失败</option><option value="no_quote">无可用报价</option><option value="cancelled">已停止</option>
            </select>
            <a id="auto-export" class="btn btn-sm btn-outline-primary">导出结果</a>
            <button id="auto-copy-table" type="button" class="btn btn-sm btn-outline-primary">复制整个表（完整报价）</button>
        </div>
        <p class="small text-muted">卡卡省默认显示价格最低的前10条，可展开其余报价。复制整个表包含当前任务全部地址和完整报价，不受分页和状态筛选影响。</p>
        <div class="table-responsive"><table class="table table-sm table-bordered align-middle">
            <thead><tr><th>收货地址</th><th>状态 / 实际询价时间</th><th>Maersk</th><th>卡卡省</th><th>ABF</th><th>明细 / 错误</th></tr></thead>
            <tbody id="auto-items"></tbody>
        </table></div>
        <div class="d-flex gap-2 align-items-center">
            <button type="button" id="auto-items-prev" class="btn btn-sm btn-outline-secondary">上一页</button>
            <span id="auto-items-page"></span>
            <button type="button" id="auto-items-next" class="btn btn-sm btn-outline-secondary">下一页</button>
        </div>
    </div>
</section>
